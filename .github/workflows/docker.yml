name: Build and push docker image

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    tags: ["v*"]
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "attach/**"
      - "benchmark/**"
      - "cmake/**"
      - "daemon/**"
      - "runtime/**"
      - "tools/**"
      - "vm/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/docker.yml"
      - "Dockerfile"
      - "attach/**"
      - "benchmark/**"
      - "cmake/**"
      - "daemon/**"
      - "runtime/**"
      - "tools/**"
      - "vm/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    # run only when code is compiling and tests are passing
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: build docker
        run: docker build .

  build-and-push-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build-image
    if: "github.event_name != 'pull_request' && github.repository_owner == 'eunomia-bpf'"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Github Packages
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bpftime
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=long

      - name: Build image and push to GitHub Container Registry
        id: docker_build
        uses: docker/build-push-action@v7
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./
          file: Dockerfile
          platforms: linux/amd64
          # Note: tags has to be all lower-case
          tags: ${{ steps.meta.outputs.tags }}
          push: true

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository_owner == 'eunomia-bpf'"
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists"
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest
