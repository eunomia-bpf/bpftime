name: RISC-V 64 Cross Build and Test

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/test-riscv64.yml"
      - "attach/base_attach_impl/**"
      - "attach/trap_uprobe_attach_impl/**"
      - "attach/CMakeLists.txt"
      - "runtime/agent/**"
      - "runtime/src/**"
      - "runtime/include/**"
      - "runtime/object/**"
      - "runtime/unit-test/**"
      - "runtime/CMakeLists.txt"
      - "cmake/libbpf.cmake"
      - ".github/script/setup-riscv64-sysroot.sh"
      - "third_party/vmlinux/riscv/**"
      - "runtime/include/bpftime_config.hpp"
      - "runtime/src/bpftime_config.cpp"
      - "cmake/StandardSettings.cmake"
      - "cmake/riscv64-toolchain.cmake"
      - "CMakeLists.txt"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/test-riscv64.yml"
      - "attach/base_attach_impl/**"
      - "attach/trap_uprobe_attach_impl/**"
      - "attach/CMakeLists.txt"
      - "runtime/agent/**"
      - "runtime/src/**"
      - "runtime/include/**"
      - "runtime/object/**"
      - "runtime/unit-test/**"
      - "runtime/CMakeLists.txt"
      - "cmake/libbpf.cmake"
      - ".github/script/setup-riscv64-sysroot.sh"
      - "third_party/vmlinux/riscv/**"
      - "runtime/include/bpftime_config.hpp"
      - "runtime/src/bpftime_config.cpp"
      - "cmake/StandardSettings.cmake"
      - "cmake/riscv64-toolchain.cmake"
      - "CMakeLists.txt"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  cross-build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross toolchain and qemu-user
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
            qemu-user qemu-user-binfmt \
            clang-18 libboost-dev cmake make pkg-config

      - name: Extract target LLVM and runtime dependencies
        run: bash .github/script/setup-riscv64-sysroot.sh "$RUNNER_TEMP/riscv64-sysroot"

      - name: Configure for riscv64 (${{ matrix.build_type }})
        run: |
          export PKG_CONFIG_SYSROOT_DIR="$RUNNER_TEMP/riscv64-sysroot"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_SYSROOT_DIR/usr/lib/riscv64-linux-gnu/pkgconfig:$PKG_CONFIG_SYSROOT_DIR/usr/share/pkgconfig"
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/riscv64-toolchain.cmake \
            -DCMAKE_SYSROOT="$PKG_CONFIG_SYSROOT_DIR" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DBUILD_BPFTIME_DAEMON=OFF \
            -DBPFTIME_ENABLE_UNIT_TESTING=ON \
            -DENABLE_EBPF_VERIFIER=OFF \
            -DBPFTIME_LLVM_JIT=ON \
            -DLLVM_DIR="$PKG_CONFIG_SYSROOT_DIR/usr/lib/llvm-18/lib/cmake/llvm" \
            -DBPFTIME_BPF_CLANG=/usr/bin/clang-18 \
            -DBPFTIME_BUILD_WITH_LIBBPF=ON \
            -DBoost_INCLUDE_DIR="$PKG_CONFIG_SYSROOT_DIR/usr/include"

      - name: Verify cmake options
        run: |
          grep BPFTIME_ENABLE_FRIDA build/CMakeCache.txt
          grep BPFTIME_ENABLE_TRAP_UPROBE build/CMakeCache.txt
          # frida must be OFF, trap must be ON
          grep -q 'BPFTIME_ENABLE_FRIDA:BOOL=OFF' build/CMakeCache.txt
          grep -q 'BPFTIME_ENABLE_TRAP_UPROBE:BOOL=ON' build/CMakeCache.txt

      - name: Build agent and runtime integration tests
        run: |
          export PKG_CONFIG_SYSROOT_DIR="$RUNNER_TEMP/riscv64-sysroot"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_SYSROOT_DIR/usr/lib/riscv64-linux-gnu/pkgconfig:$PKG_CONFIG_SYSROOT_DIR/usr/share/pkgconfig"
          cmake --build build --target bpftime-agent bpftime_runtime_tests bpftime_trap_uprobe_attach_tests -j$(nproc)

      - name: Run trap backend tests under qemu-user
        run: |
          qemu-riscv64 -L "$RUNNER_TEMP/riscv64-sysroot" \
            build/attach/trap_uprobe_attach_impl/bpftime_trap_uprobe_attach_tests
          qemu-riscv64 -L "$RUNNER_TEMP/riscv64-sysroot" \
            build/attach/trap_uprobe_attach_impl/bpftime_trap_late_host \
            build/attach/trap_uprobe_attach_impl/libbpftime_trap_late_module.so

      - name: Run trap and eBPF integration and admission tests
        run: |
          # The shared-memory link test additionally needs robust futexes.
          # qemu-user returns ENOSYS for set_robust_list; run that test in
          # the native runtime suite, without weakening Boost's mutexes.
          qemu-riscv64 -L "$RUNNER_TEMP/riscv64-sysroot" \
            build/runtime/unit-test/bpftime_runtime_tests \
            'Test probing internal functions with the trap backend,Trap BPF*'
