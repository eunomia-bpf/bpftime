name: Build and test PTX pass executables

# DIAGNOSTIC BRANCH ONLY — fix/ci-gpu-runner-preflight.
# Read-only hardware/toolchain preflight against the existing static
# self-hosted runner pool (labels: self-hosted, linux, x64, nvidia, teslam40).
# This ref is never merged, has no pull request, and does not replace any
# required check on master or feature branches. The filename is reused so the
# already-registered workflow can be workflow_dispatch-selected on this ref.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-runner-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-preflight:
    runs-on: [self-hosted, linux, x64, nvidia, teslam40]
    timeout-minutes: 15
    steps:
      - name: Read-only GPU hardware and toolchain preflight
        shell: bash
        run: |
          set -u -o pipefail
          echo "== kernel and architecture =="
          uname -srm
          echo "== GPU query (name, driver version, total memory only) =="
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          echo "== CUDA compiler =="
          if command -v nvcc >/dev/null 2>&1; then
            nvcc --version
          else
            echo "nvcc: not found on PATH"
          fi
          echo "== CUDA installation directories =="
          ls -d /usr/local/cuda* 2>/dev/null || echo "no /usr/local/cuda* entries"
          echo "== compiler and tool versions =="
          for tool in gcc g++ clang clang-18 cmake ninja python3 llvm-config-18; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf '%s path: %s\n' "$tool" "$(command -v "$tool")"
              "$tool" --version 2>&1 | head -n 1
            else
              echo "$tool: not found"
            fi
          done
          echo "preflight-ok"
