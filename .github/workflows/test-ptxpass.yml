name: Build and test PTX pass executables

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/test-ptxpass.yml"
      - ".github/actions/ccache/**"
      - "attach/nv_attach_impl/**"
      - "bpftime-verifier/**"
      - "runtime/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/test-ptxpass.yml"
      - ".github/actions/ccache/**"
      - "attach/nv_attach_impl/**"
      - "bpftime-verifier/**"
      - "runtime/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-ptxpass:
    # GPU runners in eunomia-bpf carry self-hosted, linux, x64, gpu, nvidia and
    # a label naming the card model (rtx5090 on the lab runners).
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Initialize bpftool submodules (libbpf)
        run: |
          rm -rf third_party/bpftool/libbpf
          git submodule update --init --recursive third_party/bpftool

      - name: Initialize ubpf submodules (bpf_conformance)
        run: |
          rm -rf third_party/ubpf/external/bpf_conformance
          git submodule update --init --recursive third_party/ubpf
      - name: Enable ccache
        uses: ./.github/actions/ccache
        with:
          variant: gpu

      - name: Initialize verifier submodules
        run: |
          rm -rf bpftime-verifier/ebpf-verifier/external/bpf_conformance
          git submodule update --init --recursive bpftime-verifier/ebpf-verifier

      - name: Check and install required tools
        run: |
          # GPU runners are shared hosts running several jobs per machine:
          # wait out a concurrent dpkg run instead of failing on the lock,
          # keep debconf non-interactive, and retry transient fetch errors.
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS=(-o DPkg::Lock::Timeout=120 -o Acquire::Retries=3)
          echo "Checking installed tools..."
          
          sudo -E apt-get "${APT_OPTS[@]}" update
          sudo -E apt-get "${APT_OPTS[@]}" install -y build-essential llvm-dev llvm-18-dev cmake libboost-all-dev libelf-dev libzstd-dev libyaml-cpp-dev pkg-config ninja-build

          # Check CUDA
          nvcc --version || echo "nvcc not found (CUDA compiler)"
          echo $(which nvcc)
      - name: Detect LLVM and configure CMake
        shell: bash
        run: |
            cmake -B build -S . \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBPFTIME_LLVM_JIT=YES \
              -DBPFTIME_ENABLE_UNIT_TESTING=YES \
              -DBPFTIME_ENABLE_CUDA_ATTACH=ON \
              -DENABLE_EBPF_VERIFIER=YES \
              -DFETCHCONTENT_SOURCE_DIR_CATCH2="${GITHUB_WORKSPACE}/third_party/Catch2" \
              -DBPFTIME_CUDA_ROOT="${BPFTIME_CUDA_ROOT:-/usr/local/cuda}" \
              -DLLVM_DIR="/usr/lib/llvm-18/lib/cmake/llvm/" \
              -G Ninja
          
      - name: Build PTX pass targets
        run: |
          cmake --build build --config Debug --target \
            ptxpass_kprobe_entry ptxpass_kretprobe ptxpass_kprobe_memcapture bpftime_nv_attach_tests -j$(nproc)

      - name: Run PTX pass unit tests with Catch2
        shell: bash
        run: |
          ./build/attach/nv_attach_impl/test/bpftime_nv_attach_tests

      - name: Build runtime unit tests with CUDA attach enabled
        run: |
          cmake --build build --config Debug --target bpftime_runtime_tests -j$(nproc)

      - name: Run GPU verifier partial-failure regression
        shell: bash
        run: |
          # CUDA-gated case in runtime/unit-test/test_attach_failures.cpp:
          # a STRICT-mode GPU rejection must skip only the rejected handler.
          ./build/runtime/unit-test/bpftime_runtime_tests \
            "GPU verifier rejection skips only the rejected handler"
