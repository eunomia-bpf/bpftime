name: Nginx attach test

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/test-nginx-attach.yml"
      - ".github/script/run_nginx_attach_example.py"
      - "attach/**"
      - "example/attach_implementation/**"
      - "runtime/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/test-nginx-attach.yml"
      - ".github/script/run_nginx_attach_example.py"
      - "attach/**"
      - "example/attach_implementation/**"
      - "runtime/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    permissions:
      actions: read
    with:
      hosted: ubuntu-latest
      jobs: 1

  build-and-test:
    needs: pick-runner
    # The VM runners or GitHub's, whichever is picked for this run; job
    # containers on a VM runner run --privileged against that VM's own kernel.
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner || '"ubuntu-latest"') }}
    container:
      image: debian:12
      options: --privileged -v /sys/kernel/debug/:/sys/kernel/debug:rw -v /sys/kernel/tracing:/sys/kernel/tracing:rw
    steps:
      - name: Install dependencies
        run: |
          apt-get update -y
          apt-get install -y lcov libzstd-dev libboost-all-dev gpg nginx libelf-dev git cmake gcc g++ make clang llvm-15 libpcre2-dev automake python3 python3-pip python3-requests llvm-15
      - uses: actions/checkout@v2
        with:
          submodules: "recursive"
      - name: Enable ccache
        uses: ./.github/actions/ccache
        with:
          variant: debian12
      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_ATTACH_IMPL_EXAMPLE=YES -DBPFTIME_LLVM_JIT=YES -DBUILD_BPFTIME_DAEMON=OFF -DLLVM_DIR=/usr/lib/llvm-15/cmake -B build -S .
          cmake --build build --config Release --target attach_impl_example_nginx -j$(nproc)
      - name: Display version of nginx
        run: |
          nginx -v
      - name: Test
        run: |
          python3 ./.github/script/run_nginx_attach_example.py nginx ./build/example/attach_implementation/controller/attach_impl_example_controller ./example/attach_implementation/
