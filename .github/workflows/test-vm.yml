name: Build and Test VM

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/test-vm.yml"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".gitmodules"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/test-vm.yml"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".gitmodules"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  build:
    # GitHub's ubuntu-latest runner by default. The repository or organization
    # variable BPFTIME_LINUX_RUNNER, a JSON list of runner labels such as
    # ["self-hosted","linux","x64","vm"], moves the job to those runners;
    # job containers there run --privileged against that VM's own kernel.
    runs-on: ${{ fromJSON(vars.BPFTIME_LINUX_RUNNER || '"ubuntu-latest"') }}
    strategy:
      matrix:
        container:
          - ubuntu-2204
          - fedora-39
    container: 
      image: "manjusakalza/bpftime-base-image:${{matrix.container}}"
      options: --privileged
    steps:

    - name: cache dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ github.workspace }}/${{ env.INSTALL_LOCATION }}
        key: ${{ runner.os }}-dependencies
    - uses: actions/checkout@v2
      with:
        submodules: 'recursive'
    - uses: actions/setup-python@v4
      if: startsWith(matrix.container,'ubuntu')
      with:
        python-version: '3.8'
    - name: build
      run: make build-vm
    - name: test
      run: ctest --test-dir vm/build --output-on-failure
