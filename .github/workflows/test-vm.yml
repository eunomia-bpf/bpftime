name: Build and Test VM

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/test-vm.yml"
      - ".github/actions/ccache/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".gitmodules"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/test-vm.yml"
      - ".github/actions/ccache/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  pick-runner:
    uses: ./.github/workflows/pick-runner.yml
    permissions:
      actions: read
    with:
      hosted: ubuntu-latest
      jobs: 2

  build:
    needs: pick-runner
    # The VM runners or GitHub's, whichever is picked for this run; job
    # containers on a VM runner run --privileged against that VM's own kernel.
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.runner || '"ubuntu-latest"') }}
    strategy:
      matrix:
        container:
          - ubuntu-2204
          - fedora-39
    container: 
      image: "manjusakalza/bpftime-base-image:${{matrix.container}}"
      options: --privileged
    steps:

    - uses: actions/checkout@v2
      with:
        submodules: 'recursive'
    - name: Enable ccache
      uses: ./.github/actions/ccache
      with:
        variant: ${{ matrix.container }}
    - uses: actions/setup-python@v4
      if: startsWith(matrix.container,'ubuntu')
      with:
        python-version: '3.8'
    - name: build
      run: make build-vm
    - name: test
      run: ctest --test-dir vm/build --output-on-failure
