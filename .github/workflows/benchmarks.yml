name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: ["master"]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "benchmark/**"
      - "attach/**"
      - "example/attach_implementation/**"
      - "runtime/**"
      - "tools/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".gitmodules"
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "benchmark/**"
      - "attach/**"
      - "example/attach_implementation/**"
      - "runtime/**"
      - "tools/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".gitmodules"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages,
# reading the master baseline artifact and commenting results on PRs
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  pull-requests: write

# Allow only one concurrent deployment for the pages part
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-run:
    # LLVM 17 apt packages are unavailable on Ubuntu 26.04 (resolute).
    # Ubuntu 22.04 (jammy) provides llvm-toolchain-jammy-17.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: "recursive"
      - name: Enable ccache
        uses: ./.github/actions/ccache
        with:
          variant: benchmarks

      - name: install deps
        run: |
          sudo apt update
          wget https://apt.llvm.org/llvm.sh && chmod +x llvm.sh && sudo ./llvm.sh 17
          sudo apt update
          sudo apt install -y --no-install-recommends \
            libelf1 libelf-dev zlib1g-dev libssl-dev make cmake git libboost-all-dev \
            binutils-dev libyaml-cpp-dev ca-certificates clang llvm pkg-config llvm-dev

      - name: install additional dependencies for experiments
        run: |
          sudo apt-get install libfuse-dev fuse libfuse3-dev

      - name: install python dependencies
        run: |
          sudo apt install -y python3-pip
          pip3 install -r benchmark/requirements.txt

      - name: verify llvm-17 installation
        run: llvm-config-17 --version

      # No build tree to clear: every run starts from a fresh checkout, and
      # deleting build trees defeats the ccache/object reuse policy.

      - name: build benchmarks
        run: make benchmark

      - name: run micro-benchmarks
        run: |
          # run micro-benchmarks
          python3 benchmark/uprobe/benchmark.py --iter 3
          # run remove to avoid conflict with the previous run
          sudo build/tools/bpftimetool/bpftimetool remove
          python3 benchmark/syscall/benchmark.py
          sudo build/tools/bpftimetool/bpftimetool remove
          python3 benchmark/mpk/benchmark.py --iter 3

      - name: fetch master baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow benchmarks.yml --branch master --event push \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              -n benchmark-summary -D "$RUNNER_TEMP/baseline"
          fi

      - name: summarize benchmark results
        run: |
          mkdir -p "$RUNNER_TEMP/summary"
          python3 benchmark/ci_summary.py \
            --baseline "$RUNNER_TEMP/baseline/benchmark-summary.json" \
            --output-json "$RUNNER_TEMP/summary/benchmark-summary.json" \
            --output-md "$RUNNER_TEMP/summary/benchmark-summary.md"
          cat "$RUNNER_TEMP/summary/benchmark-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: upload benchmark summary
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: ${{ runner.temp }}/summary/benchmark-summary.json

      # Fork pull requests get a read-only token, so only comment on
      # same-repository pull requests. The comment is keyed on a hidden
      # marker and edited in place on every push instead of duplicated.
      - name: comment benchmark summary on pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$RUNNER_TEMP/summary/benchmark-summary.md"
          marker='<!-- bpftime-benchmark-summary -->'
          comment_id=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))) | .id" \
            | head -n1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -F body=@"$body"
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -F body=@"$body"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-run
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
