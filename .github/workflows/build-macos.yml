name: Build on macOS

# Rootless syscall tracing / seccomp / libbpf-backed features are Linux-only
# and are guarded by __linux__. This workflow guards the cross-platform core
# (runtime, maps, shm, helpers) against Darwin build regressions such as the
# fork identity cache fixed in the pid/tgid helpers. It is a compile gate;
# unit tests require libbpf and therefore run only on the Linux workflows.

on:
  workflow_dispatch:
  push:
    branches: [master, "ci/**"]
    paths:
      - ".github/workflows/build-macos.yml"
      - "runtime/**"
      - "attach/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "compat/**"
      - "CMakeLists.txt"
      - ".gitmodules"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/build-macos.yml"
      - "runtime/**"
      - "attach/**"
      - "vm/**"
      - "cmake/**"
      - "third_party/**"
      - "compat/**"
      - "CMakeLists.txt"
      - ".gitmodules"

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository (with nested submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: brew install cmake boost

      - name: Configure (Darwin, no libbpf/frida/CUDA/verifier)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBPFTIME_BUILD_WITH_LIBBPF=OFF \
            -DBPFTIME_LLVM_JIT=OFF \
            -DBUILD_BPFTIME_DAEMON=OFF \
            -DBPFTIME_ENABLE_FRIDA=OFF \
            -DBPFTIME_ENABLE_CUDA_ATTACH=OFF \
            -DBPFTIME_ENABLE_UNIT_TESTING=OFF \
            -DENABLE_EBPF_VERIFIER=OFF

      # Build only the cross-platform runtime target. agent/syscall-server pull
      # in Linux-only headers (asm/unistd.h, sys/epoll.h, GNU --whole-archive)
      # and are out of scope for the Darwin compile gate.
      - name: Build runtime target
        run: cmake --build build --target runtime -j"$(sysctl -n hw.ncpu)"

      - name: Confirm runtime static library was produced
        run: test -s build/runtime/libruntime.a
