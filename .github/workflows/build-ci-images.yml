name: Build CI base images

# Manual-only publisher for the container images backing the test
# workflows. Normal pushes and pull requests never start this workflow;
# a maintainer dispatches it after changing .github/ci-images/ or when a
# refreshed image is needed. Images land in the community organization's
# GHCR namespace: ghcr.io/eunomia-bpf/ci-*
on:
  workflow_dispatch:
    inputs:
      images:
        description: Which images to build
        type: choice
        required: true
        default: all
        options:
          - all
          - ubuntu-2204
          - fedora-39
          - openeuler-2403
      push:
        description: Push the images to ghcr.io (off = build only, for validating a change)
        type: boolean
        required: true
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: build-ci-images-${{ github.event.inputs.images }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.choice }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # A job-level 'if' cannot read the matrix context, so the input
        # selects the matrix dimension itself: all three choices, or a
        # single-element matrix for one dispatched image.
        choice: ${{ inputs.images == 'all' && fromJSON('["ubuntu-2204","fedora-39","openeuler-2403"]') || fromJSON(format('["{0}"]', inputs.images)) }}
        include:
          - choice: ubuntu-2204
            dockerfile: .github/ci-images/Dockerfile.ubuntu-2204
            image: ci-ubuntu-2204
          - choice: fedora-39
            dockerfile: .github/ci-images/Dockerfile.fedora-39
            image: ci-fedora-39
          - choice: openeuler-2403
            dockerfile: .github/ci-images/Dockerfile.openeuler-2403
            image: ci-openeuler-2403
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .github/ci-images
          file: ${{ matrix.dockerfile }}
          # An immutable per-commit tag plus a moving latest tag; callers
          # pin the immutable tag once an image is validated.
          tags: |
            ghcr.io/eunomia-bpf/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/eunomia-bpf/${{ matrix.image }}:latest
          push: ${{ github.event.inputs.push }}
          # Keep build output readable in the run summary without uploading
          # the image as a workflow artifact.
          load: ${{ github.event.inputs.push != 'true' }}
